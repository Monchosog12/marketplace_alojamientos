<div class="container-fluid contenedorPrincipal">
  <div class="row">

    <div class="col-md-3">
      <app-filtrocomponent
        [alojamientosOriginales]="alojamientosOriginales()"
        (cambioAlojamientos)="alojamientos.set($event)">
      </app-filtrocomponent>
    </div>

    <div class="col-md-9">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h2>Algunos alojamientos</h2>
          <p class="text-muted">Mostrando {{ alojamientos().length }} resultados</p>
        </div>
      </div>

      <div class="row">
        @for (alojamiento of alojamientos(); track $index) {
          <div class="col-md-4 mb-4">
            <div class="card h-100 shadow-sm border-0 contenedorAlojamientos">
              <img [src]="alojamiento.imagenPrincipal" [alt]="alojamiento.nombre"
                   class="card-img-top img-fluid rounded-top">
              <div class="card-body d-flex flex-column contenedorInfo">
                <span class="badge bg-light text-dark align-self-start mb-2">{{ alojamiento.tipo }}</span>
                <h5 class="card-title">{{ alojamiento.nombre }}</h5>
                <p class="card-text text-muted small">Ubicación: {{ alojamiento.ubicacion }}</p>
                <div class="d-flex justify-content-between align-items-center mt-auto">
                  <span class="fw-bold fs-5">{{ alojamiento.precioNoche | currency:'COP':'symbol':'1.0-0' }}</span>
                  <button
                    class="btn btn-outline-danger btn-sm rounded-circle p-2"
                    (click)="latir(alojamiento.id)"
                    [class.animate__heartBeat]="latiendo() === alojamiento.id"
                    [class.favorito]="esFavorito(alojamiento.id)">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                         viewBox="0 0 640 640">
                      <path
                        d="M442.9 144C415.6 144 389.9 157.1 373.9 179.2L339.5 226.8C335 233 327.8 236.7 320.1 236.7C312.4 236.7 305.2 233 300.7 226.8L266.3 179.2C250.3 157.1 224.6 144 197.3 144C150.3 144 112.2 182.1 112.2 229.1C112.2 279 144.2 327.5 180.3 371.4C221.4 421.4 271.7 465.4 306.2 491.7C309.4 494.1 314.1 495.9 320.2 495.9C326.3 495.9 331 494.1 334.2 491.7C368.7 465.4 419 421.3 460.1 371.4C496.3 327.5 528.2 279 528.2 229.1C528.2 182.1 490.1 144 443.1 144z..."/>
                    </svg>
                  </button>
                </div>
                <button class="btn btn-dark w-100 mt-3">Reservar</button>
              </div>
            </div>
          </div>
        }
      </div>

    </div>
  </div>
</div>
